name: license_manager
description: Privacy-conscious credential expiry management for small businesses.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  flutter_secure_storage_windows: ^4.2.2
  path_provider: ^2.1.6
  sqlite3: ^3.9.1
  crypto: ^3.0.7
  local_auth: ^3.0.2
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  local_auth_platform_interface: ^1.1.0
  fake_async: ^1.3.3

dependency_overrides:
  flutter_secure_storage_windows:
    path: packages/flutter_secure_storage_windows

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
